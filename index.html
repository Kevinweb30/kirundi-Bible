<meta charset="utf-8">
<title>Bibiliya Kirundi</title>
<style>
/* ============================================================
   DESIGN PLAN
   Layout: sticky top nav (book/chapter pickers + prev/next) —
   scrolling reading column, comfortable measure — sticky bottom
   audio bar (safe-area aware), collapses to an unobtrusive
   "no audio yet" strip when a chapter has none. A verse-action
   toolbar and a dismissible daily-verse banner extend the same
   visual language.
   ============================================================ */
:root{
  --bg:#f6f4ef;           /* warm paper, not cream-cliché */
  --surface:#ffffff;
  --ink:#241f1a;
  --ink-dim:#6b6459;
  --rule:#e4ddd0;
  --accent:#2f4858;       /* deep dusk teal-blue */
  --accent-ink:#ffffff;
  --accent-soft:#e4ecee;
  --verse-active:#f4e9c9; /* warm highlight, lamp-lit page */
  --verse-active-ink:#241f1a;
  --danger:#8a3b2c;
  --hl-y:rgba(230,180,50,.32);
  --hl-g:rgba(90,175,120,.28);
  --hl-b:rgba(90,150,210,.26);
  --hl-p:rgba(210,110,160,.26);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512;
    --surface:#1e1c18;
    --ink:#ece7dd;
    --ink-dim:#a39a8b;
    --rule:#332f28;
    --accent:#8fb8c9;
    --accent-ink:#12211f;
    --accent-soft:#233234;
    --verse-active:#3a3421;
    --verse-active-ink:#f3e9c9;
    --danger:#e0917f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161512;
  --surface:#1e1c18;
  --ink:#ece7dd;
  --ink-dim:#a39a8b;
  --rule:#332f28;
  --accent:#8fb8c9;
  --accent-ink:#12211f;
  --accent-soft:#233234;
  --verse-active:#3a3421;
  --verse-active-ink:#f3e9c9;
  --danger:#e0917f;
  color-scheme: dark;
}

/* Type */
@import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Work+Sans:wght@400;500;600;700&display=swap');
:root{
  --font-scripture: 'Literata', Georgia, 'Times New Roman', serif;
  --font-ui: 'Work Sans', system-ui, -apple-system, sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  padding:0;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--rule);
  padding:10px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.brand h1{
  font-family:var(--font-scripture);
  font-weight:600;
  font-size:1.05rem;
  margin:0;
  letter-spacing:.01em;
}
.brand-actions{
  display:flex;
  align-items:center;
  gap:2px;
}
button.icon-btn{
  background:none;border:none;color:var(--ink-dim);
  font-family:var(--font-ui);font-size:.8rem;
  display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;
  width:42px;height:42px;padding:0;border-radius:9px;
}
button.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
button.icon-btn svg{width:21px;height:21px}

.nav-row{
  display:flex;
  align-items:stretch;
  gap:6px;
}
.picker{
  flex:1;
  min-width:0;
  display:flex;
  gap:6px;
}
select{
  flex:1;
  min-width:0;
  appearance:none;
  background:var(--bg);
  color:var(--ink);
  border:1px solid var(--rule);
  border-radius:8px;
  padding:8px 28px 8px 10px;
  font-family:var(--font-ui);
  font-size:.85rem;
  font-weight:500;
  background-image:linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position:calc(100% - 15px) center, calc(100% - 10px) center;
  background-size:5px 5px, 5px 5px;
  background-repeat:no-repeat;
}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.step-btn{
  width:36px;flex:none;
  border:1px solid var(--rule);
  background:var(--bg);
  color:var(--ink);
  border-radius:8px;
  font-size:1rem;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.step-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.step-btn:disabled{opacity:.35;cursor:default}
.step-btn:disabled:hover{background:var(--bg)}

/* ---------- daily verse banner ---------- */
.daily-banner{
  background:var(--accent-soft);
  border-bottom:1px solid var(--rule);
  padding:12px 16px;
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.daily-banner .db-text{flex:1;min-width:0}
.daily-banner .db-label{
  font-family:var(--font-ui);font-size:.74rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
  margin:0 0 4px;
}
.daily-banner .db-verse{
  font-family:var(--font-scripture);font-size:1rem;line-height:1.5;
  color:var(--ink);margin:0 0 6px;
}
.daily-banner .db-ref{
  font-family:var(--font-ui);font-size:.82rem;color:var(--ink-dim);
}
.daily-banner .db-ref button{
  background:none;border:none;color:var(--accent);font-weight:600;
  font-family:var(--font-ui);font-size:.82rem;cursor:pointer;padding:6px 0;
  text-decoration:underline;
}
.daily-banner .db-close{
  flex:none;background:none;border:none;color:var(--ink-dim);cursor:pointer;
  width:38px;height:38px;padding:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.daily-banner .db-close:hover{color:var(--ink)}
.daily-banner .db-close svg{width:16px;height:16px}
.daily-banner.has-bg{
  background-size:cover;
  background-position:center;
}
.daily-banner.has-bg .db-label{color:#f0c674}
.daily-banner.has-bg .db-verse{color:#fff}
.daily-banner.has-bg .db-ref{color:rgba(255,255,255,.75)}
.daily-banner.has-bg .db-ref button{color:#f0c674}
.daily-banner.has-bg .db-close{color:rgba(255,255,255,.8)}
.daily-banner.has-bg .db-close:hover{color:#fff}

.daily-img-wrap{
  margin:0 auto 16px;
  max-width:300px;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.22);
  background:var(--accent-soft);
  min-height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.daily-img-wrap img{
  display:block;
  width:100%;
  height:auto;
}
.daily-img-loading{
  color:var(--ink-dim);
  font-size:.88rem;
  text-align:center;
  padding:20px;
}

/* ---------- reading column ---------- */
main{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.reading{
  max-width:640px;
  margin:0 auto;
  padding:28px 20px 140px;
}
.book-title{
  font-family:var(--font-ui);
  font-size:.72rem;
  font-weight:600;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 2px;
}
.chapter-num{
  font-family:var(--font-scripture);
  font-size:2rem;
  font-weight:600;
  margin:0 0 22px;
  color:var(--ink);
}
.heading{
  font-family:var(--font-scripture);
  font-weight:600;
  font-style:italic;
  font-size:1.02rem;
  color:var(--ink-dim);
  margin:28px 0 10px;
}
.verses{
  font-family:var(--font-scripture);
  font-size:1.14rem;
  line-height:1.85;
  color:var(--ink);
}
.verse{
  cursor:pointer;
  border-radius:4px;
  padding:.02em 2px;
  transition:background-color .15s ease, color .15s ease;
  box-shadow:inset 0 0 0 0 transparent;
}
.verse:hover{background:var(--accent-soft)}
.verse.hl-y{background:var(--hl-y)}
.verse.hl-g{background:var(--hl-g)}
.verse.hl-b{background:var(--hl-b)}
.verse.hl-p{background:var(--hl-p)}
.verse.active{
  background:var(--verse-active);
  color:var(--verse-active-ink);
}
.verse.flash{
  animation:flashfade 2.2s ease-out;
}
@keyframes flashfade{
  0%{background:var(--verse-active);color:var(--verse-active-ink)}
  70%{background:var(--verse-active);color:var(--verse-active-ink)}
  100%{background:inherit}
}
.vnum{
  font-family:var(--font-ui);
  font-size:.66em;
  font-weight:700;
  color:var(--accent);
  vertical-align:super;
  margin-right:.15em;
  user-select:none;
}
.verse.active .vnum{color:inherit;opacity:.7}
.mk-star, .mk-note{
  font-size:.6em;
  vertical-align:super;
  margin-right:.1em;
  opacity:.75;
  user-select:none;
}

.empty-note{
  font-family:var(--font-ui);
  font-size:.85rem;
  color:var(--ink-dim);
  text-align:center;
  padding:60px 20px;
}

/* ---------- bottom audio bar ---------- */
.audiobar{
  position:sticky;
  bottom:0;
  z-index:20;
  background:var(--surface);
  border-top:1px solid var(--rule);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.audiobar-inner{
  max-width:640px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.transport-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
.transport-center{
  grid-column:2;
  justify-self:center;
  display:flex;
  align-items:center;
  gap:20px;
}
.speed-btn{
  grid-column:1;
  justify-self:start;
  flex:none;
  border:1px solid var(--rule);
  background:var(--bg);
  color:var(--ink);
  border-radius:999px;
  padding:6px 11px;
  font-family:var(--font-ui);
  font-weight:600;
  font-size:.72rem;
  font-variant-numeric:tabular-nums;
  cursor:pointer;
  min-width:42px;
}
.speed-btn:hover{border-color:var(--accent);color:var(--accent)}
.speed-btn:disabled{opacity:.3;cursor:default}
.dl-btn{
  grid-column:3;
  justify-self:end;
  flex:none;
  width:42px;height:42px;
  border-radius:50%;
  border:1px solid var(--rule);
  background:var(--bg);
  color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  position:relative;
}
.dl-btn:hover{border-color:var(--accent);color:var(--accent)}
.dl-btn.done{color:#4a9a6a;border-color:#4a9a6a}
.dl-btn svg{width:19px;height:19px}
.dl-btn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skip-btn{
  flex:none;
  width:38px;height:38px;
  border-radius:50%;
  border:none;
  background:none;
  color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.skip-btn:hover{background:var(--accent-soft);color:var(--accent)}
.skip-btn:disabled{opacity:.3;cursor:default}
.skip-btn:disabled:hover{background:none}
.skip-btn svg{width:25px;height:25px}
.play-btn{
  flex:none;
  width:60px;height:60px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}
.play-btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.play-btn svg{width:24px;height:24px}
.scrub-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}
.time{
  font-family:var(--font-ui);
  font-variant-numeric:tabular-nums;
  font-size:.72rem;
  color:var(--ink-dim);
  flex:none;
  width:34px;
}
.time.end{text-align:right}
.scrub{
  flex:1;
  min-width:0;
  height:4px;
  border-radius:2px;
  background:var(--rule);
  position:relative;
  cursor:pointer;
}
.scrub-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:var(--accent);
  border-radius:2px;
  width:0%;
}
.scrub-knob{
  position:absolute;top:50%;
  width:12px;height:12px;border-radius:50%;
  background:var(--accent);
  transform:translate(-50%,-50%);
  left:0%;
  box-shadow:0 0 0 3px var(--surface);
}
.no-audio{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--ink-dim);
  font-family:var(--font-ui);
  font-size:.78rem;
  max-width:640px;
  margin:0 auto;
}
.no-audio svg{width:15px;height:15px;flex:none;opacity:.6}
[hidden]{display:none!important}

/* ---------- verse action toolbar ---------- */
.verse-action-bar{
  max-width:640px;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--accent-soft);
  border-radius:12px;
  padding:8px 8px 8px 12px;
}
.va-ref{
  flex:1;
  min-width:0;
  font-family:var(--font-ui);
  font-size:.86rem;
  font-weight:600;
  color:var(--accent);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.va-actions{display:flex;align-items:center;gap:0;position:relative}
.va-btn{
  background:none;border:none;color:var(--ink-dim);cursor:pointer;
  width:42px;height:42px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.va-btn svg{width:21px;height:21px}
.va-btn:hover{background:rgba(0,0,0,.06);color:var(--accent)}
.va-btn.on{color:var(--accent)}
.va-close{color:var(--ink-dim)}
.hl-palette{
  position:absolute;
  bottom:48px;right:0;
  background:var(--surface);
  border:1px solid var(--rule);
  border-radius:12px;
  padding:10px;
  display:flex;
  gap:10px;
  box-shadow:0 4px 18px rgba(0,0,0,.18);
}
.hl-swatch{
  width:32px;height:32px;border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}
.hl-swatch.none{
  background:var(--bg);
  border:1px solid var(--rule);
  position:relative;
}
.hl-swatch.none::after{
  content:'';position:absolute;left:4px;right:4px;top:50%;height:1.5px;
  background:var(--danger);transform:rotate(45deg);
}

/* ---------- sheets (generic bottom sheet system) ---------- */
.sheet-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.4);
  z-index:30;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet{
  background:var(--surface);
  color:var(--ink);
  width:100%;
  max-width:520px;
  max-height:84vh;
  overflow-y:auto;
  border-radius:16px 16px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));
  font-family:var(--font-ui);
  font-size:1rem;
  line-height:1.6;
}
.sheet h2{
  font-family:var(--font-scripture);
  font-size:1.4rem;
  margin:0 0 4px;
}
.sheet .sub{color:var(--ink-dim);font-size:.88rem;margin:0 0 18px}
.sheet p{margin:0 0 12px}
.sheet .close-row{display:flex;justify-content:flex-end;margin-top:16px}
.sheet button.done{
  background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:10px;padding:13px 22px;
  font-family:var(--font-ui);font-weight:600;font-size:.95rem;cursor:pointer;
  min-height:46px;
}
.sheet button.secondary{
  background:none;color:var(--accent);
  border:1px solid var(--rule);border-radius:10px;padding:13px 22px;
  font-family:var(--font-ui);font-weight:600;font-size:.95rem;cursor:pointer;
  min-height:46px;
}
.sheet button.danger-link{
  background:none;border:none;color:var(--danger);
  font-family:var(--font-ui);font-size:.9rem;cursor:pointer;padding:8px 0;
}
.credit-block{
  background:var(--accent-soft);
  border-radius:10px;
  padding:14px;
  font-size:.88rem;
  color:var(--ink);
  margin:14px 0;
}
.credit-block a{color:var(--accent)}

/* menu list */
.menu-list{list-style:none;margin:0;padding:0}
.menu-row{
  display:flex;align-items:center;gap:14px;
  padding:16px 4px;border-bottom:1px solid var(--rule);
  cursor:pointer;
  min-height:44px;
}
.menu-row:last-child{border-bottom:none}
.menu-row svg.mi{width:22px;height:22px;color:var(--accent);flex:none}
.menu-row .ml-label{flex:1;font-weight:500;color:var(--ink);font-size:1rem}
.menu-row svg.chev{width:18px;height:18px;color:var(--ink-dim);flex:none}

/* search */
.search-input-wrap{
  position:sticky;top:0;background:var(--surface);
  padding-bottom:10px;margin-bottom:6px;
}
#searchInput{
  width:100%;
  border:1px solid var(--rule);
  background:var(--bg);
  color:var(--ink);
  border-radius:10px;
  padding:14px 16px;
  font-family:var(--font-ui);
  font-size:16px;
}
#searchInput:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search-status{color:var(--ink-dim);font-size:.88rem;padding:12px 2px}
.search-result{
  padding:14px 2px;border-bottom:1px solid var(--rule);cursor:pointer;
  min-height:44px;
}
.search-result:last-child{border-bottom:none}
.sr-ref{font-size:.8rem;font-weight:700;color:var(--accent);margin-bottom:3px}
.sr-text{font-family:var(--font-scripture);font-size:1.05rem;line-height:1.5;color:var(--ink)}
.sr-text mark{background:var(--verse-active);color:var(--verse-active-ink);border-radius:2px}

/* marks list */
.mark-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:14px 2px;border-bottom:1px solid var(--rule);
}
.mark-row:last-child{border-bottom:none}
.mark-main{flex:1;min-width:0;cursor:pointer}
.mark-badges{display:flex;gap:6px;margin-bottom:4px}
.mark-badges span{font-size:.7rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.mark-text{font-family:var(--font-scripture);font-size:1rem;color:var(--ink);line-height:1.45}
.mark-note-text{font-size:.86rem;color:var(--ink-dim);margin-top:4px;font-style:italic}
.mark-del{flex:none;background:none;border:none;color:var(--ink-dim);cursor:pointer;padding:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
.mark-del svg{width:18px;height:18px}
.mark-del:hover{color:var(--danger)}

/* note editor */
#noteTextarea{
  width:100%;min-height:130px;resize:vertical;
  border:1px solid var(--rule);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:14px;font-family:var(--font-ui);font-size:16px;
  line-height:1.55;
}
.sheet-actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}

/* downloads */
.dl-row{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1px solid var(--rule);min-height:44px}
.dl-row:last-child{border-bottom:none}
.dl-row .dl-main{flex:1;font-size:.98rem}
.dl-row button.mark-del{flex:none}
.storage-note{color:var(--ink-dim);font-size:.86rem;margin:4px 0 16px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;
  font-family:var(--font-ui);font-size:.8rem;font-weight:500;
  z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1}
</style>

<div class="topbar">
  <div class="brand">
    <h1>Bibiliya</h1>
    <div class="brand-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Shakisha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </div>
  <div class="nav-row">
    <div class="picker">
      <select id="bookSelect" aria-label="Book"></select>
      <select id="chapterSelect" aria-label="Chapter"></select>
    </div>
    <button class="step-btn" id="prevBtn" aria-label="Previous chapter">&#8249;</button>

<script>
(function(){
  "use strict";

  var state = {
    index: null,
    bookCache: {},
    code: null,
    chapter: null,
    verses: [],
    activeVerseIdx: -1,
    audioAvailable: false,
    selectedIdx: -1,
    marks: {},
    searchIndex: null,
    searchIndexLoading: null
  };

  var els = {
    bookSelect: document.getElementById('bookSelect'),
    chapterSelect: document.getElementById('chapterSelect'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    reading: document.getElementById('reading'),
    audioControls: document.getElementById('audioControls'),
    noAudioNote: document.getElementById('noAudioNote'),
    playBtn: document.getElementById('playBtn'),
    playIcon: document.getElementById('playIcon'),
    pauseIcon: document.getElementById('pauseIcon'),
    skipBackBtn: document.getElementById('skipBackBtn'),
    skipFwdBtn: document.getElementById('skipFwdBtn'),
    speedBtn: document.getElementById('speedBtn'),
    curTime: document.getElementById('curTime'),
    durTime: document.getElementById('durTime'),

    scrubKnob: document.getElementById('scrubKnob'),
    searchBtn: document.getElementById('searchBtn'),
    menuBtn: document.getElementById('menuBtn'),

    dbReadBtn: document.getElementById('dbReadBtn'),
    dbCloseBtn: document.getElementById('dbCloseBtn'),
    verseActionBar: document.getElementById('verseActionBar'),
    vaRef: document.getElementById('vaRef'),
    vaBookmark: document.getElementById('vaBookmark'),
    vaBookmarkIcon: document.getElementById('vaBookmarkIcon'),
    vaHighlight: document.getElementById('vaHighlight'),
    vaNote: document.getElementById('vaNote'),
    vaShare: document.getElementById('vaShare'),
    vaClose: document.getElementById('vaClose'),

    dlIconDone: document.getElementById('dlIconDone'),

    sheet: document.getElementById('sheet'),
    toast: document.getElementById('toast')
  };

  var audio = new Audio();
  audio.preload = 'metadata';

  function pad3(n){ n = String(n); return n.length>=3?n:('000'+n).slice(-3); }

  function audioPathFor(code, chapterNum){
    return 'audio/' + code + '_' + pad3(chapterNum) + '.mp3';
  }

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec/60);
    var s = Math.floor(sec%60);
    return m + ':' + (s<10?'0':'') + s;
  }

  function safeGet(key){
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  function safeSet(key, val){
    try { localStorage.setItem(key, val); } catch(e){}
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ els.toast.classList.remove('show'); }, 1800);
  }

  // ---------- data loading ----------
  function loadIndex(){
    return fetch('data/index.json').then(function(r){ return r.json(); }).then(function(idx){
      state.index = idx;
      populateBookSelect();
      cacheOfflineAsset('data/index.json');
    });
  }

  function loadBook(code){
    if (state.bookCache[code]) return Promise.resolve(state.bookCache[code]);
    var url = 'data/books/' + code + '.json';
    return fetch(url).then(function(r){ return r.json(); }).then(function(book){
      state.bookCache[code] = book;
      cacheOfflineAsset(url);
      return book;
    });
  }

  // ---------- nav population ----------
  function populateBookSelect(){
    var ot = document.createElement('optgroup');
    ot.label = 'Old Testament';
    var nt = document.createElement('optgroup');
    nt.label = 'New Testament';
    state.index.books.forEach(function(b){
      var opt = document.createElement('option');
      opt.value = b.code;
      opt.textContent = b.title;
      (b.testament === 'OT' ? ot : nt).appendChild(opt);
    });
    els.bookSelect.appendChild(ot);
    els.bookSelect.appendChild(nt);
  }

  function bookMeta(code){
    return state.index.books.find(function(b){ return b.code === code; });
  }

  function populateChapterSelect(code){
    var meta = bookMeta(code);
    els.chapterSelect.innerHTML = '';
    for (var i=1;i<=meta.chapters;i++){
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = 'Ch ' + i;
      els.chapterSelect.appendChild(opt);
    }
  }

  // ---------- marks (bookmarks / highlights / notes) ----------
  function loadMarks(){
    try {
      state.marks = JSON.parse(safeGet('bible_marks') || '{}');
    } catch(e){ state.marks = {}; }
  }
  function saveMarks(){ safeSet('bible_marks', JSON.stringify(state.marks)); }
  function markKey(code, ch, vn){ return code + '.' + ch + '.' + vn; }
  function getMark(key){ return state.marks[key] || null; }
  function setMark(key, patch, meta){
    var m = state.marks[key] || {};
    Object.keys(patch).forEach(function(k){ m[k] = patch[k]; });
    if (meta){
      m.ref = meta.ref; m.text = meta.text; m.code = meta.code;
      m.ch = meta.ch; m.vn = meta.vn;
    }
    m.ts = Date.now();
    var empty = !m.bookmark && !m.highlight && !(m.note && m.note.trim());
    if (empty){ delete state.marks[key]; } else { state.marks[key] = m; }
    saveMarks();
  }

  // ---------- rendering ----------
  function renderChapter(code, chNum){
    return loadBook(code).then(function(book){
      var ch = book.chapters[String(chNum)];
      state.verses = ch.verses;
      state.activeVerseIdx = -1;
      state.selectedIdx = -1;
      hideVerseActionBar();

      var meta = bookMeta(code);
      var html = '<p class="book-title">' + esc(book.title) + '</p>';
      html += '<h2 class="chapter-num">' + chNum + '</h2>';

      var headingsByVerse = {};
      (ch.headings || []).forEach(function(h){
        var key = h.before_verse == null ? 'end' : h.before_verse;
        headingsByVerse[key] = headingsByVerse[key] || [];
        headingsByVerse[key].push(h.text);
      });

      ch.verses.forEach(function(v, i){
        if (headingsByVerse[v.n]){
          headingsByVerse[v.n].forEach(function(t){
            html += '<div class="heading">' + esc(t) + '</div>';
          });
        }
        var key = markKey(code, chNum, v.n);
        var mark = getMark(key);
        var cls = 'verse';
        if (mark && mark.highlight) cls += ' hl-' + mark.highlight;
        html += '<span class="' + cls + '" data-idx="' + i + '" data-start="' + (v.start==null?'':v.start) + '" data-end="' + (v.end==null?'':v.end) + '">';
        html += '<span class="vnum">' + v.n + '</span>';
        if (mark && mark.bookmark) html += '<span class="mk-star">&#9733;</span>';
        if (mark && mark.note && mark.note.trim()) html += '<span class="mk-note">&#9998;</span>';
        html += esc(v.text) + ' ';
        html += '</span>';
      });
      if (headingsByVerse['end']){
        headingsByVerse['end'].forEach(function(t){
          html += '<div class="heading">' + esc(t) + '</div>';
        });
      }

      els.reading.innerHTML = '<div class="verses">' + html + '</div>';

      Array.prototype.forEach.call(els.reading.querySelectorAll('.verse'), function(el){
        el.addEventListener('click', function(){
          var idx = parseInt(el.getAttribute('data-idx'), 10);
          var v = state.verses[idx];
          if (state.audioAvailable && v.start != null){
            seekThenPlay(v.start);
          }
          selectVerseForActions(idx);
        });
      });

      setActiveVerse(-1);
    });
  }

  function setActiveVerse(idx){
    if (state.activeVerseIdx === idx) return;
    var prev = els.reading.querySelector('.verse.active');
    if (prev) prev.classList.remove('active');
    state.activeVerseIdx = idx;
    if (idx >= 0){
      var el = els.reading.querySelector('.verse[data-idx="' + idx + '"]');
      if (el){
        el.classList.add('active');
        var rect = el.getBoundingClientRect();
        var mainRect = document.querySelector('main').getBoundingClientRect();
        if (rect.top < mainRect.top + 80 || rect.bottom > mainRect.bottom - 100){
          el.scrollIntoView({ behavior:'smooth', block:'center' });
        }
      }
    }
  }

  function flashVerse(idx){
    var el = els.reading.querySelector('.verse[data-idx="' + idx + '"]');
    if (!el) return;
    el.scrollIntoView({ behavior:'smooth', block:'center' });
    el.classList.remove('flash'); void el.offsetWidth;
    el.classList.add('flash');
  }

  // ---------- verse action toolbar ----------
  function selectVerseForActions(idx){
    state.selectedIdx = idx;
    var v = state.verses[idx];
    var meta = bookMeta(state.code);
    var ref = meta.title + ' ' + state.chapter + ':' + v.n;
    els.vaRef.textContent = ref;
    var key = markKey(state.code, state.chapter, v.n);
    var mark = getMark(key);
    els.vaBookmark.classList.toggle('on', !!(mark && mark.bookmark));
    els.vaHighlight.classList.toggle('on', !!(mark && mark.highlight));
    els.vaNote.classList.toggle('on', !!(mark && mark.note && mark.note.trim()));
    els.hlPalette.hidden = true;
    els.verseActionBar.hidden = false;
  }
  function hideVerseActionBar(){
    state.selectedIdx = -1;
    els.verseActionBar.hidden = true;
    els.hlPalette.hidden = true;
  }
  function currentSelectedVerse(){
    if (state.selectedIdx < 0) return null;
    return state.verses[state.selectedIdx];
  }
  function refreshVerseEl(vn){
    var meta = bookMeta(state.code);
    var key = markKey(state.code, state.chapter, vn);
    var mark = getMark(key);
    var el = els.reading.querySelector('.verse[data-idx="' + state.selectedIdx + '"]');
    if (!el) return;
    el.classList.remove('hl-y','hl-g','hl-b','hl-p');
    if (mark && mark.highlight) el.classList.add('hl-' + mark.highlight);
    var star = el.querySelector('.mk-star');
    var note = el.querySelector('.mk-note');
    if (mark && mark.bookmark){ if (!star){ el.querySelector('.vnum').insertAdjacentHTML('afterend', '<span class="mk-star">&#9733;</span>'); } }
    else if (star){ star.remove(); }
    if (mark && mark.note && mark.note.trim()){ if (!note){ var afterStar = el.querySelector('.mk-star'); (afterStar||el.querySelector('.vnum')).insertAdjacentHTML('afterend', '<span class="mk-note">&#9998;</span>'); } }
    else if (note){ note.remove(); }
  }

  els.vaClose.addEventListener('click', hideVerseActionBar);

  els.vaBookmark.addEventListener('click', function(){
    var v = currentSelectedVerse(); if (!v) return;
    var meta = bookMeta(state.code);
    var key = markKey(state.code, state.chapter, v.n);
    var mark = getMark(key);
    var newVal = !(mark && mark.bookmark);
    setMark(key, { bookmark: newVal }, {
      ref: meta.title + ' ' + state.chapter + ':' + v.n,
      text: v.text, code: state.code, ch: state.chapter, vn: v.n
    });
    els.vaBookmark.classList.toggle('on', newVal);
    refreshVerseEl(v.n);
    showToast(newVal ? 'Vyabitswe' : 'Vyakuwemo');
  });

  els.vaHighlight.addEventListener('click', function(e){
    e.stopPropagation();
    els.hlPalette.hidden = !els.hlPalette.hidden;
  });
  Array.prototype.forEach.call(els.hlPalette.querySelectorAll('.hl-swatch'), function(sw){
    sw.addEventListener('click', function(){
      var v = currentSelectedVerse(); if (!v) return;
      var meta = bookMeta(state.code);
      var key = markKey(state.code, state.chapter, v.n);
      var color = sw.getAttribute('data-color') || null;
      setMark(key, { highlight: color }, {
        ref: meta.title + ' ' + state.chapter + ':' + v.n,
        text: v.text, code: state.code, ch: state.chapter, vn: v.n
      });
      els.vaHighlight.classList.toggle('on', !!color);
      refreshVerseEl(v.n);
      els.hlPalette.hidden = true;
    });
  });

  els.vaNote.addEventListener('click', function(){
    var v = currentSelectedVerse(); if (!v) return;
    var meta = bookMeta(state.code);
    var key = markKey(state.code, state.chapter, v.n);
    var mark = getMark(key);
    openSheet('note', {
      key: key, ref: meta.title + ' ' + state.chapter + ':' + v.n,
      text: v.text, existing: (mark && mark.note) || '',
      code: state.code, ch: state.chapter, vn: v.n
    });
  });

  els.vaShare.addEventListener('click', function(){
    var v = currentSelectedVerse(); if (!v) return;
    var meta = bookMeta(state.code);
    var ref = meta.title + ' ' + state.chapter + ':' + v.n;
    var link = location.origin + location.pathname + '#' + state.code + '.' + state.chapter;
    var text = '"' + v.text + '" — ' + ref + ' (Bibiliya Kirundi)\n' + link;
    if (navigator.share){
      navigator.share({ text: text }).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast('Vyanditswe (copied)');
      }).catch(function(){ showToast(text); });
    } else {
      showToast(text);
    }
  });

  // ---------- daily verse ----------

  // ---------- verse card image (download / share to status) ----------
  function wrapCanvasText(ctx, text, maxWidth){
    var words = text.split(' ');
    var lines = [];
    var current = '';
    words.forEach(function(w){
      var test = current ? current + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function buildVerseCardBlob(text, ref, bgUrl){
    return new Promise(function(resolve, reject){
      var W = 1080, H = 1920;
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.onload = function(){
        try {
          var ir = img.width / img.height, cr = W / H, sw, sh, sx, sy;
          if (ir > cr){ sh = img.height; sw = sh * cr; sx = (img.width - sw)/2; sy = 0; }
          else { sw = img.width; sh = sw / cr; sx = 0; sy = (img.height - sh)/2; }
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);

          var grad = ctx.createLinearGradient(0,0,0,H);
          grad.addColorStop(0, 'rgba(8,10,16,.55)');
          grad.addColorStop(0.45, 'rgba(8,10,16,.4)');
          grad.addColorStop(1, 'rgba(8,10,16,.75)');
          ctx.fillStyle = grad;
          ctx.fillRect(0,0,W,H);

          var finish = function(){
            var margin = 100;
            var maxWidth = W - margin*2;
            var fontSize = 72, lines, lineHeight;
            do {
              ctx.font = '600 ' + fontSize + 'px Literata, Georgia, serif';
              lines = wrapCanvasText(ctx, text, maxWidth);
              lineHeight = fontSize * 1.32;
              if (lines.length * lineHeight < 760 || fontSize <= 38) break;
              fontSize -= 4;
            } while (true);

            var totalTextHeight = lines.length * lineHeight;
            var startY = H/2 - totalTextHeight/2;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = '#ffffff';
            ctx.font = '600 ' + fontSize + 'px Literata, Georgia, serif';
            lines.forEach(function(line, i){
              ctx.fillText(line, W/2, startY + i*lineHeight + fontSize);
            });

            var dividerY = startY + totalTextHeight + 46;
            ctx.strokeStyle = 'rgba(240,198,116,.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(W/2 - 46, dividerY);
            ctx.lineTo(W/2 + 46, dividerY);
            ctx.stroke();

            ctx.font = '700 36px "Work Sans", sans-serif';
            ctx.fillStyle = '#f0c674';
            ctx.fillText(ref.toUpperCase(), W/2, dividerY + 56);

            ctx.font = '600 28px "Work Sans", sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,.82)';
            ctx.fillText('BIBILIYA KIRUNDI', W/2, H - 90);

            canvas.toBlob(function(blob){
              if (blob) resolve(blob); else reject(new Error('toBlob failed'));
            }, 'image/jpeg', 0.9);
          };

          if (document.fonts && document.fonts.ready){
            document.fonts.ready.then(finish).catch(finish);
          } else {
            finish();
          }
        } catch(e){ reject(e); }
      };
      img.onerror = function(){ reject(new Error('image load failed')); };
      img.src = bgUrl;
    });
  }

  // ---------- offline downloads (Cache Storage) ----------
  var OFFLINE_CACHE = 'kirundi-bible-v1';
  var hasCaches = (typeof caches !== 'undefined');

  function cacheOfflineAsset(url){
    if (!hasCaches) return;
    try {
      caches.open(OFFLINE_CACHE).then(function(cache){
        fetch(url).then(function(resp){
          if (resp && resp.ok) cache.put(url, resp.clone());
        }).catch(function(){});
      });
    } catch(e){}
  }

  function isAudioCached(url){
    if (!hasCaches) return Promise.resolve(false);
    return caches.open(OFFLINE_CACHE).then(function(cache){
      return cache.match(url).then(function(r){ return !!r; });
    }).catch(function(){ return false; });
  }

  function getPlayableUrl(url){
    if (!hasCaches) return Promise.resolve(url);
    return caches.open(OFFLINE_CACHE).then(function(cache){
      return cache.match(url).then(function(r){
        if (!r) return url;
        return r.blob().then(function(b){ return URL.createObjectURL(b); });
      });
    }).catch(function(){ return url; });
  }

  function downloadChapterAudio(url, onProgress){
    if (!hasCaches) return Promise.reject(new Error('no cache support'));
    return caches.open(OFFLINE_CACHE).then(function(cache){
      return fetch(url).then(function(resp){
        if (!resp.ok) throw new Error('fetch failed');
        return cache.put(url, resp.clone()).then(function(){ return resp; });
      });
    });
  }

  function removeChapterAudio(url){
    if (!hasCaches) return Promise.resolve();
    return caches.open(OFFLINE_CACHE).then(function(cache){ return cache.delete(url); });
  }

  function listDownloadedChapters(){
    if (!hasCaches) return Promise.resolve([]);
    return caches.open(OFFLINE_CACHE).then(function(cache){
      return cache.keys().then(function(reqs){
        return reqs
          .map(function(r){ return r.url; })
          .filter(function(u){ return /\/audio\//.test(u); })
          .map(function(u){
            var m = u.match(/([0-9A-Z]+)_(\d{3})\.mp3$/);
            if (!m) return null;
            var code = m[1], ch = parseInt(m[2],10);
            var meta = state.index && bookMeta(code);
            return { url: u, code: code, ch: ch, title: meta ? meta.title : code };

  // ---------- audio wiring ----------
  function loadAudioForChapter(code, chNum){
    state.audioAvailable = false;
    els.audioControls.hidden = true;
    els.noAudioNote.hidden = false;
    audio.pause();
    audio.removeAttribute('src');
    var url = audioPathFor(code, chNum);
    getPlayableUrl(url).then(function(playUrl){
      audio.src = playUrl;
      audio.load();
    });
    refreshDownloadButton();
  }

  audio.addEventListener('error', function(){
    state.audioAvailable = false;
    els.audioControls.hidden = true;
    els.noAudioNote.hidden = false;
  });
  audio.addEventListener('loadedmetadata', function(){
    state.audioAvailable = true;
    els.audioControls.hidden = false;
    els.noAudioNote.hidden = true;
    els.durTime.textContent = fmtTime(audio.duration);
  });
  function syncPlaybackUI(){
    if (!state.audioAvailable) return;
    // Ground-truth correction: whatever the 'play'/'pause' events or any
    // optimistic UI update believe happened, this runs on every real
    // timeupdate tick (i.e. whenever audio.currentTime is genuinely
    // advancing) and forces the icon to match reality. This is what
    // actually fixes a stuck icon, regardless of why an event got missed
    // or a play() promise's rejection handler fired after the fact.
    setPlayingUI(!audio.paused);
    els.curTime.textContent = fmtTime(audio.currentTime);
    var pct = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
    els.scrubFill.style.width = pct + '%';
    els.scrubKnob.style.left = pct + '%';

    var t = audio.currentTime;
    var idx = -1;
    for (var i=0;i<state.verses.length;i++){
      var v = state.verses[i];
      if (v.start == null) continue;
      var end = v.end == null ? Infinity : v.end;
      if (t >= v.start && t < end){ idx = i; break; }
    }
    if (idx !== -1) setActiveVerse(idx);
  }
  audio.addEventListener('timeupdate', syncPlaybackUI);

  // Single source of truth for the play/pause icon swap. Driven by the
  // audio element's real 'play'/'pause'/'ended' events (authoritative),
  // but ALSO called optimistically the instant the user taps a control —
  // some mobile browsers delay firing 'play' until the stream has actually
  // buffered enough to render frames, which left the icon looking stuck on
  // "paused" for a beat (or, on some devices, indefinitely) even though
  // playback had been correctly requested.
  function setPlayingUI(isPlaying){
    els.playIcon.hidden = isPlaying;
    els.pauseIcon.hidden = !isPlaying;
  }
  audio.addEventListener('play', function(){ setPlayingUI(true); });
  audio.addEventListener('playing', function(){ setPlayingUI(true); });
  audio.addEventListener('pause', function(){ setPlayingUI(false); });
  audio.addEventListener('ended', function(){ setPlayingUI(false); });

  els.playBtn.addEventListener('click', function(){
    if (!state.audioAvailable) return;
    if (audio.paused){
      setPlayingUI(true);
      var p = audio.play();
      if (p && typeof p.catch === 'function'){
        p.catch(function(){ setPlayingUI(false); });
      }
    } else {
      setPlayingUI(false);
      audio.pause();
    }
  });

  function clampToDuration(t){
    var d = isFinite(audio.duration) ? audio.duration : t;
    return Math.min(Math.max(t, 0), d);
  }
  els.skipBackBtn.addEventListener('click', function(){
    if (!state.audioAvailable) return;
    audio.currentTime = clampToDuration(audio.currentTime - 10);
    syncPlaybackUI();
  });
  els.skipFwdBtn.addEventListener('click', function(){
    if (!state.audioAvailable) return;
    audio.currentTime = clampToDuration(audio.currentTime + 10);
    syncPlaybackUI();
  });

  var SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
  var speedIdx = 0;
  els.speedBtn.addEventListener('click', function(){
    if (!state.audioAvailable) return;
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    var rate = SPEEDS[speedIdx];
    audio.playbackRate = rate;
    els.speedBtn.textContent = (rate === 1 ? '1' : String(rate)) + '×';
  });

  // IMPORTANT: this must call play() SYNCHRONOUSLY within the click handler.
  // Many mobile browsers (Safari on iPhone in particular) only allow .play()
  // to succeed when it's invoked directly inside the user's tap; deferring it
  // to a later event (like waiting for 'seeked') or a setTimeout loses that
  // "user gesture" association and the browser silently blocks playback. The
  // seek itself is async, but browsers handle that internally — starting
  // play() right away and letting the pending seek resolve on its own is the
  // standard, reliable pattern.
  function seekThenPlay(t){
    setPlayingUI(true);
    audio.currentTime = t;
    var p = audio.play();
    if (p && typeof p.catch === 'function'){
      p.catch(function(){ setPlayingUI(false); });
    }
  }

  function seekFromClientX(clientX){
    var rect = els.scrub.getBoundingClientRect();
    var pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    if (audio.duration) audio.currentTime = pct * audio.duration;
  }
  els.scrub.addEventListener('click', function(e){
    if (!state.audioAvailable) return;
    seekFromClientX(e.clientX);
  });
  var dragging = false;
  els.scrub.addEventListener('pointerdown', function(e){
    if (!state.audioAvailable) return;
    dragging = true;
    seekFromClientX(e.clientX);
  });
  window.addEventListener('pointermove', function(e){
    if (dragging) seekFromClientX(e.clientX);
  });
  window.addEventListener('pointerup', function(){ dragging = false; });

    opts = opts || {};

        var idx = state.verses.findIndex(function(v){ return v.n === opts.flashVerse; });
        if (idx !== -1) flashVerse(idx);
      }

    var meta = bookMeta(state.code);

    var atVeryEnd = bookIdx === state.index.books.length - 1 && state.chapter === meta.chapters;
    els.prevBtn.disabled = atVeryStart;
    els.nextBtn.disabled = atVeryEnd;

      document.getElementById('mRowDaily').addEventListener('click', function(){ openSheet('daily'); });
      document.getElementById('mRowMarks').addEventListener('click', function(){ openSheet('marks'); });
      document.getElementById('mRowDownloads').addEventListener('click', function(){ openSheet('downloads'); });
      document.getElementById('mRowSupport').addEventListener('click', function(){ openSheet('support'); });
      document.getElementById('mRowAbout').addEventListener('click', function(){ openSheet('about'); });
    }

    if (view === 'daily'){
      var cachedCardBlob = null;
      resolveDailyVerse().then(function(d){
        var ref = d.title + ' ' + d.ch + ':' + d.vn;
        var body = document.getElementById('dailyBody');
        if (!body) return;
        body.innerHTML = '' +
          '<div class="close-row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">' +
            '<button class="done" id="dailyReadBtn">Soma mu gitabu</button>' +
            '<button class="secondary" id="dailyDownloadBtn">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-3px;margin-right:5px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>' +
              'Kuramo ifoto' +
            '</button>' +
            '<button class="secondary" id="dailyShareBtn">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-3px;margin-right:5px"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' +
              'Sangiza ku status' +
            '</button>' +
          '</div>' +
          '<p id="dailyCardStatus" style="margin-top:12px;font-size:.86rem;color:var(--ink-dim)"></p>';
        document.getElementById('dailyReadBtn').addEventListener('click', function(){
          closeSheet();
          goTo(d.code, d.ch, { flashVerse: d.vn });
        });
        document.getElementById('dailyDownloadBtn').addEventListener('click', function(){
          if (cachedCardBlob) downloadOrShareBlob('download', cachedCardBlob, 'dailyCardStatus');
          else shareOrDownloadVerseCard('download', d.text, ref, todaysBgImage(), 'dailyCardStatus');
        });
        document.getElementById('dailyShareBtn').addEventListener('click', function(){
          if (cachedCardBlob) downloadOrShareBlob('share', cachedCardBlob, 'dailyCardStatus');
          else shareOrDownloadVerseCard('share', d.text, ref, todaysBgImage(), 'dailyCardStatus');
        });

        // Render the actual shareable card as the preview image, so what's
        // shown in-app matches exactly what gets downloaded/shared.
        buildVerseCardBlob(d.text, ref, todaysBgImage()).then(function(blob){
          cachedCardBlob = blob;
          var wrap = document.getElementById('dailyImgWrap');
          if (!wrap) return;
          var url = URL.createObjectURL(blob);
          wrap.innerHTML = '<img src="' + url + '" alt="' + esc(d.text) + ' — ' + esc(ref) + '">';
        }).catch(function(){
          var wrap = document.getElementById('dailyImgWrap');
          if (wrap) wrap.innerHTML = '<p class="daily-img-loading">' + esc(d.text) + '</p>';
        });
      });
    }

    if (view === 'marks'){
      var body = document.getElementById('marksBody');
      var keys = Object.keys(state.marks).sort(function(a,b){
        return (state.marks[b].ts||0) - (state.marks[a].ts||0);
      });
      if (!keys.length){
        body.innerHTML = '<p style="color:var(--ink-dim)">Nta kintu uracobitswe. Kanda ku murongo uwo ariwo wose ugire ngo ubike, ushireho irangi, canke wandike icatwa.</p>';
      } else {
        body.innerHTML = keys.map(function(k){
          var m = state.marks[k];
          var badges = '';
          if (m.bookmark) badges += '<span>&#9733; Bookmark</span>';
          if (m.highlight) badges += '<span>&#9679; Highlight</span>';
          if (m.note && m.note.trim()) badges += '<span>&#9998; Note</span>';
          return '' +
            '<div class="mark-row">' +
              '<div class="mark-main" data-key="' + k + '">' +
                '<div class="mark-badges">' + badges + '</div>' +
                '<div class="mark-text">' + esc(m.ref) + ' — ' + esc((m.text||'').slice(0,90)) + ((m.text||'').length>90?'…':'') + '</div>' +
                (m.note && m.note.trim() ? '<div class="mark-note-text">' + esc(m.note) + '</div>' : '') +
              '</div>' +
              '<button class="mark-del" data-key="' + k + '" aria-label="Siba">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
              '</button>' +
            '</div>';
        }).join('');
        Array.prototype.forEach.call(body.querySelectorAll('.mark-main'), function(el){
          el.addEventListener('click', function(){
            var k = el.getAttribute('data-key');
            var m = state.marks[k];
            closeSheet();
            goTo(m.code, m.ch, { flashVerse: m.vn });
          });
        });
        Array.prototype.forEach.call(body.querySelectorAll('.mark-del'), function(btn){
          btn.addEventListener('click', function(e){
            e.stopPropagation();
            var k = btn.getAttribute('data-key');
            delete state.marks[k];
            saveMarks();
            if (state.code && state.chapter){
              var parts = k.split('.');
              if (parts[0] === state.code && parseInt(parts[1],10) === state.chapter){
                var vn = parseInt(parts[2],10);
                var idx = state.verses.findIndex(function(v){ return v.n === vn; });
                if (idx !== -1){ state.selectedIdx = idx; refreshVerseEl(vn); }
              }
            }
            openSheet('marks');
          });
        });
      }
    }

    if (view === 'note'){
      var ta = document.getElementById('noteTextarea');
      document.getElementById('noteCancel').addEventListener('click', closeSheet);
      document.getElementById('noteSave').addEventListener('click', function(){
        setMark(p.key, { note: ta.value }, { ref: p.ref, text: p.text, code: p.code, ch: p.ch, vn: p.vn });
        if (state.selectedIdx >= 0) { els.vaNote.classList.toggle('on', !!ta.value.trim()); refreshVerseEl(p.vn); }
        closeSheet();
        showToast('Icatwa cabitswe');
      });
      document.getElementById('noteDelete').addEventListener('click', function(){
        setMark(p.key, { note: '' }, { ref: p.ref, text: p.text, code: p.code, ch: p.ch, vn: p.vn });
        if (state.selectedIdx >= 0) { els.vaNote.classList.remove('on'); refreshVerseEl(p.vn); }
        closeSheet();
      });
    }

    if (view === 'downloads'){
      refreshDownloadsSheet();
    }

    if (view === 'search'){
      var input = document.getElementById('searchInput');
      var results = document.getElementById('searchResults');
      input.focus();
      ensureSearchIndex().then(function(){
        if (results.querySelector('.search-status')) results.innerHTML = '<p class="search-status">Andika ijambo ushaka gushaka.</p>';
      });
      var t = null;
      input.addEventListener('input', function(){
        clearTimeout(t);
        var q = input.value.trim();
        if (!q){ results.innerHTML = '<p class="search-status">Andika ijambo ushaka gushaka.</p>'; return; }
        t = setTimeout(function(){ runSearch(q, results); }, 150);
      });
    }
  }

  function refreshDownloadsSheet(){
    var body = document.getElementById('downloadsBody');
    if (!body) return;
    listDownloadedChapters().then(function(list){
      list.sort(function(a,b){ return (a.title+a.ch).localeCompare(b.title+b.ch); });
      var storageNote = '';
      if (navigator.storage && navigator.storage.estimate){
        navigator.storage.estimate().then(function(est){
          var mb = ((est.usage||0)/1048576).toFixed(0);
          var n = body.querySelector('.storage-note');
          if (n) n.textContent = 'Storage used by this app: ~' + mb + ' MB';
        });
      }
      if (!list.length){
        body.innerHTML = '<p class="storage-note">...</p><p style="color:var(--ink-dim)">Nta gice kiracakurwa. Kanda akamenyetso ko gukura (&darr;) iruhande y’ijwi ry’igice kugira ngo ushobore kugisomera udafise internet.</p>';
        return;
      }
      body.innerHTML = '<p class="storage-note">...</p>' + list.map(function(d){
        return '' +
          '<div class="dl-row">' +
            '<div class="dl-main">' + esc(d.title) + ' — Ch ' + d.ch + '</div>' +
            '<button class="mark-del" data-url="' + esc(d.url) + '" aria-label="Siba">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>' +
            '</button>' +
          '</div>';
      }).join('') + '<div class="close-row" style="justify-content:flex-start;margin-top:10px"><button class="secondary" id="clearAllDl">Kuraho vyose</button></div>';
      Array.prototype.forEach.call(body.querySelectorAll('.mark-del'), function(btn){
        btn.addEventListener('click', function(){
          removeChapterAudio(btn.getAttribute('data-url')).then(function(){
            refreshDownloadButton();
            refreshDownloadsSheet();
          });
        });
      });
      var clearAll = document.getElementById('clearAllDl');
      if (clearAll) clearAll.addEventListener('click', function(){
        Promise.all(list.map(function(d){ return removeChapterAudio(d.url); })).then(function(){
          refreshDownloadButton();
          refreshDownloadsSheet();
        });
      });
    });
  }

  // ---------- search ----------
  function ensureSearchIndex(){
    if (state.searchIndex) return Promise.resolve(state.searchIndex);
    if (state.searchIndexLoading) return state.searchIndexLoading;
    state.searchIndexLoading = fetch('data/search-index.json').then(function(r){ return r.json(); }).then(function(idx){
      state.searchIndex = idx;
      cacheOfflineAsset('data/search-index.json');
      return idx;
    });
    return state.searchIndexLoading;
  }

  function runSearch(q, resultsEl){
    resultsEl.innerHTML = '<p class="search-status">Birimo gushakishwa...</p>';
    ensureSearchIndex().then(function(idx){
      var needle = q.toLowerCase().replace(/[’‘]/g, "'");
      var out = [];
      for (var i=0;i<idx.length && out.length<80;i++){
        var row = idx[i];
        var hay = row.x.toLowerCase().replace(/[’‘]/g, "'");
        if (hay.indexOf(needle) !== -1) out.push(row);
      }
      if (!out.length){
        resultsEl.innerHTML = '<p class="search-status">Nta kintu caboneste.</p>';
        return;
      }
      var reNeedle = needle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(' + reNeedle + ')', 'ig');
      resultsEl.innerHTML = out.map(function(row){
        var snippet = esc(row.x).replace(re, '<mark>$1</mark>');
        return '' +
          '<div class="search-result" data-code="' + row.c + '" data-ch="' + row.n + '" data-vn="' + row.v + '">' +
            '<div class="sr-ref">' + esc(row.t) + ' ' + row.n + ':' + row.v + '</div>' +
            '<div class="sr-text">' + snippet + '</div>' +
          '</div>';
      }).join('');
      Array.prototype.forEach.call(resultsEl.querySelectorAll('.search-result'), function(el){
        el.addEventListener('click', function(){
          var code = el.getAttribute('data-code');
          var ch = parseInt(el.getAttribute('data-ch'),10);
          var vn = parseInt(el.getAttribute('data-vn'),10);
          closeSheet();
          goTo(code, ch, { flashVerse: vn });
        });
      });
    });
  }

  els.searchBtn.addEventListener('click', function(){ openSheet('search'); });
  els.menuBtn.addEventListener('click', function(){ openSheet('menu'); });

  // ---------- boot ----------
  function parseHash(){
    var h = location.hash.replace('#','');
    var m = h.match(/^([1-3A-Za-z]+)\.(\d+)$/);
    if (m) return { code: m[1].toUpperCase(), chapter: parseInt(m[2],10) };
    return null;
  }

  function start(){
    loadMarks();
    loadIndex().then(function(){
      var fromHash = parseHash();
      var code = (fromHash && fromHash.code) || safeGet('lastBook') || 'GEN';
      var chapter = (fromHash && fromHash.chapter) || parseInt(safeGet('lastChapter') || '1', 10);
      if (!bookMeta(code)) code = 'GEN';
      var meta = bookMeta(code);
      if (!chapter || chapter < 1 || chapter > meta.chapters) chapter = 1;
      goTo(code, chapter, { noHash: !!fromHash });
      initDailyBanner();
      if (window.requestIdleCallback) requestIdleCallback(function(){ ensureSearchIndex(); });
      else setTimeout(function(){ ensureSearchIndex(); }, 2500);
    });
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(start) : start();
  } else {
    start();
  }
})();
</script>
